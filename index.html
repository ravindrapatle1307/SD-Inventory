ow": 5}, {"id": 41, "name": "Techings of Prahlad (E)", "category": "Book (Srila Prabhupada)", "language": "English", "cost": 5.0, "sell": 5.0, "opening": 7, "low": 5}, {"id": 42, "name": "Techings of Prahlad (H)", "category": "Book (Srila Prabhupada)", "language": "Hindi", "cost": 5.0, "sell": 5.0, "opening": 6, "low": 5}, {"id": 43, "name": "Sri Ishopanishad (H)", "category": "Book (Srila Prabhupada)", "language": "Hindi", "cost": 5.0, "sell": 5.0, "opening": 1, "low": 5}, {"id": 44, "name": "Sri Ishopanishad (Bangla)", "category": "Book (Srila Prabhupada)", "language": "Bangla", "cost": 5.0, "sell": 5.0, "opening": 2, "low": 5}, {"id": 45, "name": "Krsna Small E", "category": "Book (Srila Prabhupada)", "language": "English", "cost": 5.0, "sell": 5.0, "opening": 3, "low": 5}, {"id": 46, "name": "Krsna Small Tamil", "category": "Book (Srila Prabhupada)", "language": "Tamil", "cost": 5.0, "sell": 5.0, "opening": 1, "low": 5}, {"id": 47, "name": "Advent of 21st Centuri (H)", "category": "Book (Srila Prabhupada)", "language": "Hindi", "cost": 5.0, "sell": 5.0, "opening": 3, "low": 5}, {"id": 48, "name": "Advent of 21st Centuri (Tamil)", "category": "Book (Srila Prabhupada)", "language": "Tamil", "cost": 5.0, "sell": 5.0, "opening": 1, "low": 5}]; const LANGS=['N/A','English','Hindi','Bangla','Telugu','Oriya','Tamil','Malayalam','Arabic','Marathi','Other'];
let data=JSON.parse(localStorage.getItem('sdmgData')||'null')||{products:seed,tx:[]}; function save(){localStorage.setItem('sdmgData',JSON.stringify(data))} function today(){return new Date().toISOString().slice(0,10)}; rd.value=sd.value=today(); rl.innerHTML=LANGS.map(x=>`<option>${x}</option>`).join('');
function stockOf(p){let n=p.opening; for(const t of data.tx)if(t.pid==p.id)n+=t.type=='R'?t.qty:-t.qty; return n} function money(n){return Number(n).toFixed(2)}
function backupData(){let payload={app:'Sanatana Dham Inventory',version:7,backedUp:new Date().toISOString(),data:data};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sanatana_Dham_Inventory_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result),d=obj.data||obj;if(!d.products||!Array.isArray(d.tx))throw new Error('Invalid backup');if(!confirm('Restore this backup? Current phone data will be replaced.'))return;data=d;save();refresh();show('dash');alert('Backup restored successfully.')}catch(err){alert('Could not restore: '+err.message)}e.target.value=''};r.readAsText(f)}
function publishViewer(){
 const snapshot=JSON.stringify(data).replace(/</g,'\\u003c');
 let html=document.documentElement.outerHTML;
 const dataStart="let data=JSON.parse(localStorage.getItem('sdmgData')||'null')||{products:seed,tx:[]};";
 html=html.replace(dataStart,`let data=${snapshot};`);
 html=html.replace('<title>Sanatana Dham Inventory - Admin V5</title>','<title>Sanatana Dham Inventory - View Only</title>');

function invTable(title,items){let units=items.reduce((a,p)=>a+stockOf(p),0),value=items.reduce((a,p)=>a+stockOf(p)*p.cost,0);return `<h2 class=sectionTitle>${title}</h2><div class=card><table class=summarytable><tr><th>Item</th><th>Language</th><th>Category</th><th>Qty</th><th>Unit Cost</th><th>Inventory Value</th></tr>${items.map(p=>`<tr><td>${p.name}</td><td>${p.language}</td><td>${p.category}</td><td class="${stockOf(p)==0?'zero':''}">${stockOf(p)}</td><td>${money(p.cost)}</td><td>${money(stockOf(p)*p.cost)}</td></tr>`).join('')}<tr class=catTotal><td colspan=3>Total ${title}</td><td>${units}</td><td></td><td>${money(value)}</td></tr></table></div>`} function dashboardInventory(){let sp=data.products.filter(p=>p.category==='Book (Srila Prabhupada)'),otherBooks=data.products.filter(p=>p.category==='Book (Others)'),general=data.products.filter(p=>p.category==='General'),other=data.products.filter(p=>!['Book (Srila Prabhupada)','Book (Others)','General'].includes(p.category));return `<h1 style="margin-top:28px">Current Inventory Summary</h1>${invTable('Books - Srila Prabhupada',sp)}${invTable('Books - Others',otherBooks)}${invTable('Other Inventory',general)}${other.length?invTable('Other Categories',other):''}`}
function refresh(){rp.innerHTML='<option value="new">+ Create new item</option>'+data.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');sp.innerHTML=data.products.filter(p=>stockOf(p)>0).map(p=>`<option value="${p.id}">${p.name} (Stock ${stockOf(p)})</option>`).join('');let u=data.products.reduce((a,p)=>a+stockOf(p),0),v=data.products.reduce((a,p)=>a+stockOf(p)*p.cost,0),sales=data.tx.filter(t=>t.type=='S').reduce((a,t)=>a+t.qty*t.sell,0),profit=data.tx.filter(t=>t.type=='S').reduce((a,t)=>a+t.qty*(t.sell-t.cost),0);dash.innerHTML=`<h1>Dashboard</h1><div class="card sharebox"><h2>Publish for Viewing</h2><p>After updating stock or sales, click below to create a fresh view-only copy containing the latest data from this browser. Share only the downloaded VIEW_ONLY file.</p><button class=publish style="max-width:280px" onclick="publishViewer()">Publish / Download View-Only Copy</button></div><div class=cards><div class=card>Units<div class=big>${u}</div></div><div class=card>Stock Value<div class=big>${money(v)}</div></div><div class=card>Sales<div class=big>${money(sales)}</div></div><div class=card>Profit<div class=big>${money(profit)}</div></div></div>${dashboardInventory()}<div class=card><h2>Low Stock</h2>${data.products.filter(p=>stockOf(p)<=p.low).map(p=>`<div>${p.name}: <span class=warn>${stockOf(p)}</span></div>`).join('')}</div>`; stock.innerHTML='<h1>Current Stock</h1><div class=note>You can directly correct the physical stock quantity and unit cost below. Enter the actual stock and/or revised cost, then click <b>Update</b>. Stock corrections do not change your sales history. The revised cost is used for inventory value and future sales profit calculations.</div><table><tr><th>Item</th><th>Language</th><th>Category</th><th>Current Stock</th><th>Actual Stock</th><th>Cost</th><th>Value</th><th>Action</th></tr>'+data.products.map(p=>`<tr><td>${p.name}</td><td>${p.language}</td><td>${p.category}</td><td class="${stockOf(p)<=p.low?'warn':''}">${stockOf(p)}</td><td><input class=stockedit id=adj${p.id} type=number min=0 value="${stockOf(p)}"></td><td><input class=costedit id=cost${p.id} type=number min=0 step="0.01" value="${money(p.cost)}"></td><td>${money(stockOf(p)*p.cost)}</td><td><button class=upd onclick="updateStockRow(${p.id})">Update</button></td></tr>`).join('')+'</table>';let ss=data.tx.filter(t=>t.type=='S').slice().reverse();report.innerHTML=`<h1>Sales & Profit</h1><div class=cards><div class=card>Sales<div class=big>${money(sales)}</div></div><div class=card>Profit<div class=big>${money(profit)}</div></div></div><table><tr><th>Date</th><th>Item</th><th>Qty</th><th>Amount</th><th>Profit</th></tr>${ss.map(t=>{let p=data.products.find(x=>x.id==t.pid);return `<tr><td>${t.date}</td><td>${p.name}</td><td>${t.qty}</td><td>${money(t.qty*t.sell)}</td><td>${money(t.qty*(t.sell-t.cost))}</td></tr>`}).join('')}</table>`;newFields()}
function updateStockRow(pid){let p=data.products.find(x=>x.id==pid),actual=Number(document.getElementById('adj'+pid).value),newCost=Number(document.getElementById('cost'+pid).value),current=stockOf(p);if(!Number.isInteger(actual)||actual<0)return alert('Please enter a whole stock quantity of 0 or more.');if(!Number.isFinite(newCost)||newCost<0)return alert('Please enter a valid cost of 0 or more.');let stockChanged=actual!==current,costChanged=newCost!==Number(p.cost);if(!stockChanged&&!costChanged)return alert('No changes to update.');let msg='Update '+p.name+'?';if(stockChanged)msg+='\nStock: '+current+' to '+actual;if(costChanged)msg+='\nCost: '+money(p.cost)+' to '+money(newCost);if(!confirm(msg))return;if(stockChanged){let diff=actual-current;data.tx.push({type:diff>0?'R':'A',date:today(),pid:pid,qty:Math.abs(diff),cost:newCost,sell:p.sell,notes:'Direct stock adjustment'});}if(costChanged){p.cost=newCost;}save();refresh();alert('Stock record updated successfully.');}
function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');refresh()} function newFields(){newbox.style.display=rp.value=='new'?'block':'none'}
function receiveStock(e){e.preventDefault();let pid=rp.value;if(pid=='new'){if(!rn.value.trim())return alert('Enter item name');pid=Math.max(0,...data.products.map(p=>p.id))+1;data.products.push({id:pid,name:rn.value.trim(),category:rc.value,language:rl.value,cost:+rco.value,sell:+(rsp.value||0),opening:0,low:5})}else pid=+pid;data.tx.push({type:'R',date:rd.value,pid:pid,qty:+rq.value,cost:+rco.value,sell:+(rsp.value||0)});save();alert('Stock received');show('stock');e.target.reset();rd.value=today()}
function doSale(e){e.preventDefault();let pid=+sp.value,p=data.products.find(x=>x.id==pid),qty=+sq.value;if(qty>stockOf(p))return alert('Cannot sell more than available stock');data.tx.push({type:'S',date:sd.value,pid,qty,cost:+(sco.value||p.cost),sell:+ssp.value,notes:sn.value});save();alert('Sale recorded');show('report');e.target.reset();sd.value=today()}
